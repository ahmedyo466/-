<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>عالم التوفير</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<p class="demo">واجهة تجريبية: بعض المنتجات والأسعار والصور بيانات تجريبية وليست بيانات المتجر الفعلية.</p>
<header class="top">
  <div class="wrap bar">
    <a class="logo" href="#/"><img src="img/logo.jpg" alt="" width="259" height="48"><span id="logo" class="vh">عالم التوفير</span></a>
    <span class="grow"></span>
    <a class="ic" href="#/login" aria-label="حسابي"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a>
    <a class="ic" href="#/saved" aria-label="المحفوظات"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"/></svg></a>
    <a class="ic" href="#/cart" id="cartLink" aria-label="السلة"></a>
    <button class="ic menu" id="menu" type="button" aria-label="القائمة" aria-expanded="false"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <input class="search" id="q" type="search" placeholder="ابحث عن منتج..." aria-label="بحث في المنتجات">
  </div>
  <nav id="navwrap" aria-label="التنقل الرئيسي"><div class="wrap" id="nav"></div></nav>
</header>
<section class="banner" id="banner" hidden>
  <picture><source media="(max-width:699px)" srcset="img/banner-m.jpg"><img src="img/banner.jpg" alt="عالم التوفير: كل اللي يخص بيتك بأفضل سعر" width="1600" height="595"></picture>
  <a class="btn pri shop" href="#/search/">تسوق الآن</a>
</section>
<div class="wrap sub" id="msg" role="status"></div>
<main class="wrap" id="main" tabindex="-1"></main>
<footer class="sitefoot">
  <div class="wrap fbar"><img src="img/logo.jpg" alt="عالم التوفير" width="194" height="36"><span class="fline"></span><span id="soc"></span></div>
  <div class="wrap foot" id="foot"></div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/fx.js"></script>
<script src="js/layout.js"></script>
<script src="js/shop.js"></script>
<script src="js/detail.js"></script>
</body>
</html>
